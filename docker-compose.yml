services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ozue
      POSTGRES_USER: ozue
      POSTGRES_PASSWORD: ozue
    ports:
      - "5434:5432"
    volumes:
      - ozue_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ozue"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000
      "
    environment:
      DJANGO_SETTINGS_MODULE: ozue_backend.settings
      DATABASE_URL: postgres://ozue:ozue@db:5432/ozue
      REDIS_URL: redis://redis:6379/0
      DEBUG: "1"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  ozue_data:
